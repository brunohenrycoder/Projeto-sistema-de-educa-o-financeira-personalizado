spring.application.name=aurora-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aurora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:fiststone}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# E-mail SMTP. Configure as variáveis SMTP_* e MAIL_FROM no ambiente.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}
app.mail-from=${MAIL_FROM:}
app.email-confirmation-url=${EMAIL_CONFIRMATION_URL:http://localhost:3000/confirm-email}

# JWT Security
security.jwt.secret=${JWT_SECRET:aurora-api-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-security}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
